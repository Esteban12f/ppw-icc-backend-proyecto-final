server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    show-sql: false

    hibernate:
      ddl-auto: validate
  jpa:
    show-sql: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

logging:
  level:
    root: ${ROOT_LOG_LEVEL:WARN}
    ec.edu.ups.icc.academicevents: ${APP_LOG_LEVEL:INFO}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  issuer: ${JWT_ISSUER}

cors:
  allowed-origins: ${ALLOWED_ORIGINS}

app:
  timezone: America/Guayaquil

rate-limit:
  login:
    limit: 5
    window-seconds: 60
  register:
    limit: 3
    window-seconds: 3600
  public:
    limit: 60
    window-seconds: 60
  authenticated:
    limit: 120
    window-seconds: 60
  reports:
    limit: 5
    window-seconds: 60

login-block:
  max-attempts: 5
  attempts-window-seconds: 900
  block-duration-seconds: 900