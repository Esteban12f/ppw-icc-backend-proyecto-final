services:
  postgres:
    image: postgres:17-alpine
    container_name: academic-events-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: academic_events_db
      POSTGRES_USER: ups
      POSTGRES_PASSWORD: ups123

    ports:
      - "5435:5432"

    volumes:
      - academic_events_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ups -d academic_events_db
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: academic-events-redis
    restart: unless-stopped

    ports:
      - "6380:6379"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  academic_events_postgres_data: